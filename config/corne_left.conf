CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=360000
CONFIG_ZMK_PM_SOFT_OFF=y

# Battery: lower TX power (-8 dBm) — halves are ~10cm apart, no range needed
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y
# Battery: longer BLE connection intervals (30-50ms vs default ~15ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
# Battery QoL: expose right half's battery level to the OS via central
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
