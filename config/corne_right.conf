CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=360000

# Force central-only: disable peripheral role (prj.conf defaults to y)
CONFIG_BT_PERIPHERAL=n


# Role test: make RIGHT central + report both batteries from new central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# BLE name (right shield has no default, left gets "Corne" from Kconfig.defconfig)
CONFIG_ZMK_KEYBOARD_NAME="Corne"





