CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=360000

# Battery: lower TX power (-4 dBm) — halves are ~10cm apart, no range needed
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y
# Battery: longer BLE connection intervals (30-50ms vs default ~15ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
