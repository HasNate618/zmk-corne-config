CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=360000


# Battery: TX power -8 dBm (single-variable test, intervals stock)
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y

# Battery: slightly longer BLE intervals (20-30ms) — gentle bump
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=16
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
